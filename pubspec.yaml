dev_dependencies:
  # A full featured library for writing and running Dart tests across platforms.
  # https://pub.dev/packages/test
  # Cap removed 2026-08-23: saropa_lints now depends on analyzer ^13.1.0
  # (see dependency comment above), so test's analyzer >=13.0.0 <15.0.0
  # requirement no longer conflicts.
  test: ^1.31.2 # Unit testing framework
