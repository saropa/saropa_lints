dev_dependencies:
  # A full featured library for writing and running Dart tests across platforms.
  # https://pub.dev/packages/test
  ################ Because test >=1.31.2 depends on analyzer >=13.0.0 <15.0.0 and saropa_lints previously depended on analyzer ^12.1.0, test >=1.31.2 is forbidden.
  test: ^1.31.1 # Unit testing framework
