name: project-vibrancy

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "bin/project_vibrancy.dart"
      - "lib/src/cli/project_vibrancy.dart"
      - "test/cli/project_vibrancy_cli_test.dart"
      - ".github/workflows/project-vibrancy.yml"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.7'
      - name: Install dependencies
        # Install the committed versions and fail if pub changed pubspec.lock.
        # (Not --enforce-lockfile: it also demands a lock for example/, which is gitignored.)
        run: |
          dart pub get
          git diff --exit-code -- pubspec.lock
      - name: Run Project Vibrancy JSON scan
        run: |
          mkdir -p reports
          dart run bin/project_vibrancy.dart \
            --path . \
            --format json \
            --min-grade F \
            --max-unused 100000 \
            --max-uncovered 100000 \
            > reports/project-vibrancy.json
      - name: Upload Project Vibrancy artifact
        uses: actions/upload-artifact@v5
        with:
          name: project-vibrancy-report
          path: reports/project-vibrancy.json
