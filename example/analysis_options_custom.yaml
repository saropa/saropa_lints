# The rule test oracle (test/support/resolved_rule_harness.dart) analyses
# fixtures under example/lib. The default `light` lane only admits cheap,
# resolution-free rules once the rule registry has been built, silently
# turning every other rule into a no-op mid-suite. Tests must run all rules.
lane: full

rule_packs:
  enabled:
    - dart_sdk_3_2
    - dart_sdk_3_4

# Per-rule config: additional safe-to-ignore methods for
# avoid_ignoring_return_values (project-specific allowlist).
avoid_ignoring_return_values:
  safe_to_ignore:
    - computeHash
